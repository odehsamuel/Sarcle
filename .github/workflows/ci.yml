name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-contracts:
    name: Rust Contracts & Attester B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Unit Tests
        run: cargo test --all

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Build Contracts (WASM)
        run: |
          stellar contract build --package evidence_registry
          stellar contract build --package work_escrow

  python-services:
    name: Attester A & Synthetic Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r attester-a/requirements.txt
          pip install pytest ruff

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Ruff
        run: ruff format --check .

      - name: Run Pytest Test Suite
        run: pytest

  dashboard:
    name: Dashboard Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint Dashboard
        run: npm run lint
        working-directory: dashboard

      - name: Build Dashboard
        run: npm run build
        working-directory: dashboard

  firmware-check:
    name: ESP32 Firmware Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Compile ESP32-CAM Firmware
        run: pio run
        working-directory: firmware/esp32cam
