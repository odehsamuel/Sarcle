; PlatformIO Project Configuration File for Proof-of-Weeding Edge Firmware
; Supported Targets:
; 1. AI-Thinker ESP32-CAM (OV2640, ESP32-D0WD)
; 2. ESP32-S3-CAM (OV2640 / OV5640, ESP32-S3-WROOM-1 / N16R8)

[platformio]
default_envs = esp32cam, esp32s3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; Target 1: Classic AI-Thinker ESP32-CAM
[env:esp32cam]
platform = espressif32 @ ^6.5.0
board = esp32cam
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTARGET_ESP32_CAM
    -DCORE_DEBUG_LEVEL=3
    -DMBEDTLS_CONFIG_FILE='<mbedtls/esp_config.h>'

; Target 2: Modern ESP32-S3 Camera Module (Octal PSRAM / Flash)
[env:esp32s3]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DBOARD_HAS_PSRAM
    -DTARGET_ESP32_S3
    -DCORE_DEBUG_LEVEL=3
    -DMBEDTLS_CONFIG_FILE='<mbedtls/esp_config.h>'
